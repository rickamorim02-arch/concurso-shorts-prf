<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><link rel="manifest" href="manifest.webmanifest"><title>Concurso Shorts PRF</title><style>*{box-sizing:border-box}body{margin:0;background:#020b17;color:#fff;font:15px system-ui}.app{max-width:560px;margin:auto;min-height:100vh;background:#061a33}.top{position:fixed;z-index:3;top:0;width:min(560px,100%);padding:15px;background:#061a33ee;display:flex;justify-content:space-between}.top b{color:#ffd52e}.feed{height:100vh;overflow:auto;scroll-snap-type:y mandatory}.q{min-height:100vh;scroll-snap-align:start;padding:80px 18px 80px;display:flex;flex-direction:column;justify-content:center}.tag{color:#75c9ff;font-weight:800;font-size:12px}.topic{color:#aabbd0;margin:6px 0 18px}.q h1{font-size:23px;line-height:1.3}.opt,.btn,.card,select,input,textarea{border-radius:14px}.opt{border:1px solid #24517c;background:#0b2848;color:white;padding:14px;text-align:left;margin:6px 0}.opt.ok{background:#0d402c}.opt.no{background:#461f27}.letter{color:#ffd52e;font-weight:900}.feedback{margin-top:12px;background:#0d2948;padding:14px;border-radius:14px}.star{background:none;border:0;color:#ffd52e;margin-top:12px}nav{position:fixed;z-index:4;bottom:0;width:min(560px,100%);display:flex;justify-content:space-around;background:#061a33f5;border-top:1px solid #234667;padding:8px}nav button{background:none;border:0;color:#aabbd0;font-size:11px}nav button.on{color:#fff}.panel{padding:75px 16px}.card{background:#0b2848;border:1px solid #24517c;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric strong{font-size:24px;display:block}.hidden{display:none}button.primary{width:100%;padding:14px;background:#ffd52e;border:0;border-radius:14px;font-weight:900}input,textarea,select{width:100%;padding:12px;background:#07182e;border:1px solid #24517c;color:#fff;margin:5px 0 10px}</style></head><body><div class="app"><div class="top"><b>CONCURSO SHORTS PRF</b><small>ADMINISTRATIVO</small></div><main id="feed" class="feed"></main><section id="subjects" class="panel hidden"><h2>📚 Matérias</h2><input id="find" placeholder="Buscar matéria" oninput="subjects()"><div id="sl"></div></section><section id="stats" class="panel hidden"><h2>📊 Desempenho</h2><div class="grid"><div class="card metric"><strong id="an">0</strong>respondidas</div><div class="card metric"><strong id="ac">0</strong>acertos</div><div class="card metric"><strong id="rt">0%</strong>aproveitamento</div><div class="card metric"><strong id="fv">0</strong>favoritas</div></div><div class="card" id="bs"></div></section><section id="more" class="panel hidden"><h2>☰ Mais</h2><div class="card"><h3>🎯 Simulado</h3><select id="sim"></select><button class="primary" onclick="sim()">Começar</button></div><div class="card"><h3>➕ Nova questão</h3><select id="ns"></select><input id="nt" placeholder="Assunto"><textarea id="ne" placeholder="Enunciado"></textarea><textarea id="no" placeholder="A) ...&#10;B) ...&#10;C) ...&#10;D) ...&#10;E) ..."></textarea><select id="nr"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select><textarea id="nx" placeholder="Explicação"></textarea><button class="primary" onclick="add()">Salvar questão</button></div><div class="card"><button class="primary" onclick="exp()">📤 Exportar banco</button><br><br><button class="primary" onclick="document.querySelector('#imp').click()">📥 Importar banco</button><input id="imp" type="file" accept=".json" hidden onchange="imp(event)"></div><div class="card"><b>ℹ️ Referência</b><p>V2 voltada ao PRF Administrativo, usando referência histórica. Sempre confira o edital oficial vigente antes da prova.</p></div></section><nav><button id="nf" class="on" onclick="tab('feed')">🎬<br>Shorts</button><button id="nsu" onclick="tab('subjects')">📚<br>Matérias</button><button id="nst" onclick="tab('stats')">📊<br>Desempenho</button><button id="nmo" onclick="tab('more')">☰<br>Mais</button></nav></div><script>
const S=['Língua Portuguesa','Ética e Conduta Pública','Raciocínio Lógico','Direito Constitucional','Direito Administrativo','Administração','Arquivologia','Informática','Legislação relativa à PRF'];
const bank=[
['Língua Portuguesa','Interpretação','A compreensão textual depende principalmente de:','A) palavras isoladas|B) contexto e relações entre ideias|C) tamanho|D) pontuação|E) opinião','B','O sentido é construído pelas relações e pelo contexto.'],
['Língua Portuguesa','Gramática','Assinale a concordância adequada:','A) Houveram problemas|B) Fazem dois anos|C) Existem bons motivos|D) Haviam candidatos|E) Deve haverem vagas','C','O verbo existir concorda com o sujeito.'],
['Língua Portuguesa','Redação','A redação oficial deve privilegiar:','A) gírias|B) obscuridade|C) clareza e objetividade|D) excesso de adjetivos|E) informalidade','C','Clareza, objetividade e impessoalidade são importantes.'],
['Língua Portuguesa','Coesão','A conjunção “e” normalmente indica:','A) oposição|B) causa|C) adição|D) condição|E) conclusão','C','“E” liga elementos com ideia de adição.'],
['Língua Portuguesa','Interpretação','Coerência textual relaciona-se principalmente:','A) à lógica das ideias|B) ao número de linhas|C) às letras|D) à fonte|E) ao tamanho','A','Coerência é a compatibilidade e lógica das ideias.'],
['Ética e Conduta Pública','Ética','A atuação ética no serviço público busca:','A) interesse privado|B) favorecimento|C) interesse público|D) privilégio|E) segredo','C','A finalidade pública orienta a conduta administrativa.'],
['Ética e Conduta Pública','Impessoalidade','Impessoalidade exige:','A) favorecer amigos|B) evitar privilégios pessoais|C) ignorar regras|D) agir por preferência|E) ocultar decisões','B','Impessoalidade afasta favorecimentos pessoais.'],
['Ética e Conduta Pública','Conduta','Informação funcional deve ser utilizada:','A) para lucro|B) por amizade|C) conforme regras e deveres|D) livremente|E) sem cuidado','C','Informações obtidas no cargo devem respeitar os deveres funcionais.'],
['Ética e Conduta Pública','Ética','Conduta ética tende a fortalecer:','A) desconfiança|B) conflito|C) confiança institucional|D) arbitrariedade|E) favorecimento','C','A ética favorece confiança e legitimidade institucional.'],
['Ética e Conduta Pública','Serviço público','No atendimento ao cidadão deve prevalecer:','A) preferência pessoal|B) cortesia e respeito|C) amizade|D) vantagem|E) discriminação','B','O atendimento público deve respeitar os princípios e o cidadão.'],
['Raciocínio Lógico','Proposições','“P e Q” é verdadeira quando:','A) só P|B) só Q|C) ambas|D) nenhuma|E) P é falsa','C','A conjunção exige que as duas proposições sejam verdadeiras.'],
['Raciocínio Lógico','Negação','A negação de “Todos estudaram” é:','A) ninguém estudou|B) pelo menos um não estudou|C) todos não estudaram|D) dois estudaram|E) um estudou','B','A negação de universal é existencial.'],
['Raciocínio Lógico','Porcentagem','20% de 150 é:','A) 15|B) 20|C) 25|D) 30|E) 35','D','0,20 × 150 = 30.'],
['Raciocínio Lógico','Porcentagem','15% de R$ 200 corresponde a desconto de:','A) 15|B) 20|C) 30|D) 35|E) 40','C','0,15 × 200 = 30.'],
['Raciocínio Lógico','Proposições','Se P é verdadeira e Q falsa, “P ou Q” é:','A) verdadeira|B) falsa|C) impossível|D) sempre falsa|E) indeterminada','A','Na disjunção inclusiva basta uma ser verdadeira.'],
['Direito Constitucional','Direitos fundamentais','A Constituição Federal assegura:','A) direitos fundamentais|B) apenas direitos econômicos|C) só direitos políticos|D) nenhum direito|E) apenas direitos trabalhistas','A','Direitos e garantias fundamentais estão previstos constitucionalmente.'],
['Direito Constitucional','Princípios','Entre os princípios da Administração está:','A) pessoalidade|B) legalidade|C) arbitrariedade|D) preferência|E) informalidade','B','Legalidade está expressamente no art. 37.'],
['Direito Constitucional','Poderes','São Poderes da União:','A) Executivo, Legislativo e Judiciário|B) Civil e Militar|C) Federal e Estadual|D) Polícia e Justiça|E) só Executivo','A','A Constituição adota a separação dos três Poderes.'],
['Direito Constitucional','Administração','A administração direta é formada, em geral, por:','A) órgãos dos entes federativos|B) empresas privadas|C) só autarquias|D) só fundações|E) sociedades anônimas','A','Administração direta corresponde aos órgãos dos entes federativos.'],
['Direito Constitucional','Direitos','Liberdade de expressão é:','A) inexistente|B) direito fundamental sujeito ao sistema constitucional|C) exclusiva de servidores|D) ilimitada sempre|E) só econômica','B','É direito fundamental, exercido dentro das regras constitucionais.'],
['Direito Administrativo','Atos','Ato administrativo é, em geral:','A) manifestação administrativa no exercício da função|B) sentença|C) lei|D) contrato privado|E) costume','A','É manifestação da Administração sob regime jurídico administrativo.'],
['Direito Administrativo','Atos','Presunção de legitimidade significa que o ato:','A) nunca é questionável|B) é presumido válido até afastamento|C) não precisa de fundamento|D) é irrevogável|E) não produz efeitos','B','A presunção é relativa.'],
['Direito Administrativo','Poderes','Poder hierárquico relaciona-se a:','A) organização interna|B) processo penal|C) poder constituinte|D) comércio|E) eleições','A','Organiza funções e relações internas.'],
['Direito Administrativo','Responsabilidade','A responsabilidade civil estatal por atuação de agentes, em regra, é:','A) inexistente|B) objetiva|C) sempre subjetiva|D) só penal|E) só contratual','B','O art. 37, §6º, prevê responsabilidade objetiva nos termos constitucionais.'],
['Direito Administrativo','Atos','A Administração deve anular ato quando houver:','A) ilegalidade|B) conveniência|C) mudança de governo|D) preferência|E) aumento de receita','A','A ilegalidade fundamenta a anulação.'],
['Administração','Planejamento','Planejamento consiste em:','A) definir objetivos e caminhos|B) agir sem metas|C) eliminar controles|D) evitar decisões|E) arquivar','A','Planejar envolve objetivos, estratégias e ações.'],
['Administração','Controle','A função controle busca:','A) acompanhar resultados e corrigir desvios|B) eliminar metas|C) impedir avaliação|D) substituir planejamento|E) ocultar resultados','A','Controle compara resultados e permite correções.'],
['Administração','Pessoas','Gestão de pessoas envolve:','A) só folha|B) práticas relacionadas às pessoas e trabalho|C) só patrimônio|D) só arquivos|E) só compras','B','Inclui recrutamento, desenvolvimento, avaliação e outras práticas.'],
['Administração','Organização','Organização como função administrativa envolve:','A) distribuir recursos e responsabilidades|B) apenas punir|C) eliminar estruturas|D) impedir delegação|E) só fiscalizar','A','Organizar é estruturar recursos, atividades e responsabilidades.'],
['Administração','Indicadores','Indicador de desempenho serve para:','A) medir aspectos relevantes|B) substituir decisões|C) eliminar metas|D) impedir comparação|E) ocultar resultados','A','Indicadores apoiam acompanhamento e avaliação.'],
['Arquivologia','Arquivos','Arquivo corrente reúne documentos:','A) de uso frequente|B) sempre históricos|C) sem uso|D) apenas cópias|E) sempre permanentes','A','Documentos correntes são consultados com frequência.'],
['Arquivologia','Classificação','Classificação documental busca:','A) organizar segundo critérios|B) destruir tudo|C) digitalizar tudo|D) impedir protocolo|E) bloquear acesso','A','Classificação organiza documentos conforme critérios arquivísticos.'],
['Arquivologia','Protocolo','Protocolo relaciona-se a:','A) recebimento e registro|B) restauração apenas|C) descarte apenas|D) criação de leis|E) auditoria','A','Protocolo envolve recebimento, registro e tramitação.'],
['Arquivologia','Conservação','Conservação documental busca:','A) preservar contra deterioração|B) eliminar|C) impedir consulta|D) alterar conteúdo|E) descartar','A','Conservação reduz danos e preserva documentos.'],
['Arquivologia','Gestão','Gestão documental envolve:','A) produção, tramitação, uso, avaliação e destinação|B) só armazenamento|C) só digitalização|D) só descarte|E) só consulta','A','A gestão acompanha o ciclo de vida documental.'],
['Informática','Segurança','Phishing busca:','A) enganar para obter informações|B) acelerar internet|C) organizar arquivos|D) compactar|E) imprimir','A','Phishing usa engano para obter dados.'],
['Informática','Backup','Backup é:','A) cópia de segurança|B) navegador|C) antivírus|D) sistema operacional|E) firewall','A','É uma cópia destinada à recuperação.'],
['Informática','Internet','Navegador serve principalmente para:','A) acessar a web|B) aumentar RAM|C) substituir sistema|D) gerar energia|E) formatar impressora','A','Navegadores acessam páginas e serviços web.'],
['Informática','Senhas','Uma senha segura deve evitar:','A) padrões previsíveis|B) variedade|C) unicidade|D) comprimento|E) complexidade','A','Senhas previsíveis são mais vulneráveis.'],
['Informática','Arquivos','PDF é usado principalmente para:','A) compartilhar documentos preservando apresentação|B) executar qualquer programa|C) aumentar memória|D) substituir hardware|E) bloquear internet','A','PDF é um formato de distribuição de documentos.'],
['Legislação relativa à PRF','Atualização','Para um novo concurso, a principal referência é:','A) material antigo|B) edital oficial vigente|C) rede social|D) prova municipal|E) opinião','B','O edital oficial define regras e conteúdo do concurso.'],
['Legislação relativa à PRF','PRF','A PRF integra o:','A) Judiciário|B) Executivo federal|C) Legislativo municipal|D) setor privado|E) Ministério Público estadual','B','A PRF integra a estrutura do Poder Executivo federal.'],
['Legislação relativa à PRF','Normas','Como legislação pode mudar, o candidato deve:','A) ignorar atualizações|B) conferir normas vigentes|C) usar só material antigo|D) evitar fontes oficiais|E) nunca revisar','B','Normas devem ser conferidas em fontes oficiais e atualizadas.'],
['Legislação relativa à PRF','Vigência','Uma questão de legislação deve considerar:','A) norma aplicável e vigente|B) comentários apenas|C) memória|D) resumo antigo|E) opinião','A','É necessário verificar a norma aplicável e sua vigência.'],
['Legislação relativa à PRF','Estudo','A V2 desta aplicação é:','A) edital novo|B) referência histórica + questões autorais|C) resultado oficial|D) gabarito atual|E) previsão','B','A aplicação usa referência histórica e não afirma representar edital novo.']
];
let st=JSON.parse(localStorage.getItem('prf-v2')||'null')||{qs:bank.map((x,i)=>({id:'q'+i,s:x[0],t:x[1],q:x[2],o:x[3].split('|'),r:x[4],e:x[5]})),ans:{},fav:{}};const save=()=>localStorage.setItem('prf-v2',JSON.stringify(st));
function render(list=st.qs){feed.innerHTML='<article class="q"><span class="tag">PRF • ADMINISTRATIVO</span><h1>🎯 Concurso Shorts PRF</h1><p>Estude em formato vertical, com correção imediata, explicação, favoritas e desempenho.</p><div class="card"><b>'+st.qs.length+'</b> questões • 9 matérias</div><button class="primary" onclick="sim()">Começar simulado</button></article>'+list.map(x=>{let a=st.ans[x.id],f=st.fav[x.id];return '<article class="q"><span class="tag">'+x.s+'</span><div class="topic">'+x.t+'</div><h1>'+x.q+'</h1>'+x.o.map(o=>{let l=o[0],c=a?(l===x.r?'ok':l===a?'no':''):'';return '<button class="opt '+c+'" '+(a?'disabled':'')+' onclick="ans(\''+x.id+'\',\''+l+'\')"><span class="letter">'+l+') </span>'+o.slice(3)+'</button>'}).join('')+(a?'<div class="feedback"><b>'+(a===x.r?'✅ Correta':'❌ Incorreta')+'</b><br>'+x.e+'</div>':'')+'<button class="star" onclick="fav(\''+x.id+'\')">'+(f?'★ Favorita':'☆ Favoritar')+'</button></article>'}).join('')}
function ans(id,l){if(!st.ans[id]){st.ans[id]=l;save();render()}}function fav(id){st.fav[id]=!st.fav[id];save();render();stats()}function tab(n){document.querySelectorAll('main,section').forEach(e=>e.classList.add('hidden'));document.getElementById(n).classList.remove('hidden');document.querySelectorAll('nav button').forEach(e=>e.classList.remove('on'));document.getElementById('n'+n.slice(0,2)).classList.add('on');if(n==='subjects')subjects();if(n==='stats')stats();if(n==='more')more()}function subjects(){let f=(find.value||'').toLowerCase();sl.innerHTML=S.filter(s=>s.toLowerCase().includes(f)).map(s=>{let q=st.qs.filter(x=>x.s===s),a=q.filter(x=>st.ans[x.id]),c=a.filter(x=>st.ans[x.id]===x.r);return '<div class="card"><b>'+s+'</b><p>'+a.length+'/'+q.length+' respondidas • '+(a.length?Math.round(c.length/a.length*100):0)+'%</p><button class="primary" onclick="render(st.qs.filter(x=>x.s===\''+s+'\'));tab(\'feed\')">Estudar</button></div>'}).join('')}function stats(){let a=Object.keys(st.ans),c=a.filter(id=>{let q=st.qs.find(x=>x.id===id);return q&&st.ans[id]===q.r});an.textContent=a.length;ac.textContent=c.length;rt.textContent=a.length?Math.round(c.length/a.length*100)+'%':'0%';fv.textContent=Object.values(st.fav).filter(Boolean).length;bs.innerHTML='<h3>Por matéria</h3>'+S.map(s=>{let q=st.qs.filter(x=>x.s===s),a=q.filter(x=>st.ans[x.id]),c=a.filter(x=>st.ans[x.id]===x.r);return a.length?'<p>'+s+': <b>'+Math.round(c.length/a.length*100)+'%</b></p>':''}).join('')}function more(){let o=S.map(s=>'<option>'+s+'</option>').join('');ns.innerHTML=o;sim.innerHTML='<option value="">Todas</option>'+o}function sim(){let s=sim.value||'',q=st.qs.filter(x=>!s||x.s===s).sort(()=>Math.random()-.5).slice(0,10);tab('feed');render(q)}function add(){let o=no.value.split('\n').filter(Boolean);if(!ne.value||o.length!==5)return alert('Preencha enunciado e 5 alternativas A–E.');st.qs.push({id:'u'+Date.now(),s:ns.value,t:nt.value||'Personalizada',q:ne.value,o,r:nr.value,e:nx.value||'Questão cadastrada pelo usuário.'});save();render();alert('Questão adicionada.')}function exp(){let b=new Blob([JSON.stringify({app:'Concurso Shorts PRF V2',questions:st.qs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='questoes-prf-administrativo.json';a.click()}function imp(e){let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result),ids=new Set(st.qs.map(x=>x.id));(d.questions||[]).filter(x=>x.id&&!ids.has(x.id)).forEach(x=>st.qs.push(x));save();render();alert('Banco importado.')}catch{alert('JSON inválido')}};r.readAsText(e.target.files[0])}function render(){render()}render();more();
</script></body></html>
