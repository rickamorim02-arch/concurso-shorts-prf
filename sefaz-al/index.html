<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b2d"><link rel="manifest" href="manifest.webmanifest"><title>SEFAZ-AL Shorts</title><style>*{box-sizing:border-box}body{margin:0;background:#06131f;color:#eef6ff;font:16px system-ui}header{position:sticky;top:0;background:#071b2dee;padding:12px;z-index:4;border-bottom:1px solid #29445b}h1{font-size:18px;margin:0}.sub{font-size:12px;color:#9fc0d9}.bar{display:flex;gap:8px;overflow:auto;padding:10px 0}button,select{border:1px solid #3b607c;background:#102a3e;color:white;border-radius:12px;padding:10px}.feed{height:calc(100vh - 112px);overflow-y:auto;scroll-snap-type:y mandatory}.card{min-height:calc(100vh - 112px);scroll-snap-align:start;padding:18px;display:flex;flex-direction:column;justify-content:center;max-width:720px;margin:auto}.tag{color:#79c8ff;font-size:13px}.q{font-size:21px;line-height:1.4;margin:14px 0}.opts{display:grid;gap:10px}.opts button{text-align:left;font-size:17px}.ok{border-color:#55d98b}.bad{border-color:#ff6b6b}.exp{margin-top:14px;padding:12px;background:#102a3e;border-radius:12px}.stats{font-size:13px;color:#b9d2e5}</style></head><body><header><h1>SEFAZ-AL Shorts • Auditor Fiscal 2026</h1><div class="sub">Cebraspe • 16 disciplinas • banco central • progresso neste aparelho</div><div class="bar"><select id="filter"><option value="">Todas as matérias</option></select><button onclick="shuffle()">Embaralhar</button><button onclick="showStats()">Desempenho</button></div></header><main id="feed" class="feed"></main><script>let st=JSON.parse(localStorage.getItem('sefaz-al-shorts')||'null')||{qs:[],ans:{},fav:{}};const save=()=>localStorage.setItem('sefaz-al-shorts',JSON.stringify(st));let view=[];async function init(){try{let r=await fetch('questoes.json?v='+Date.now(),{cache:'no-store'}),d=await r.json();st.qs=d.questions;st.bankVersion=d.bank_version;save()}catch(e){};let ss=[...new Set(st.qs.map(x=>x.s))];filter.innerHTML+=[...ss].map(s=>'<option>'+s+'</option>').join('');filter.onchange=render;render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')}function render(){view=st.qs.filter(x=>!filter.value||x.s===filter.value);feed.innerHTML=view.map(x=>'<section class="card"><div class="tag">'+x.s+' • '+x.t+'</div><div class="q">'+x.q+'</div><div class="opts"><button onclick="answer(\''+x.id+'\',\'A\',this)">A) Certo</button><button onclick="answer(\''+x.id+'\',\'B\',this)">B) Errado</button></div><div id="e'+x.id+'"></div></section>').join('')}function answer(id,a,b){let q=st.qs.find(x=>x.id===id);st.ans[id]=a;save();b.classList.add(a===q.r?'ok':'bad');document.getElementById('e'+id).innerHTML='<div class="exp"><b>'+(a===q.r?'✓ Correto':'✗ Gabarito: '+q.r)+'</b><br>'+q.e+'</div>'}function shuffle(){st.qs.sort(()=>Math.random()-.5);render()}function showStats(){let a=Object.entries(st.ans),c=a.filter(([id,v])=>st.qs.find(q=>q.id===id)?.r===v).length;alert('Respondidas: '+a.length+'\nAcertos: '+c+'\nAproveitamento: '+(a.length?Math.round(c/a.length*100):0)+'%')}init()</script></body></html>
